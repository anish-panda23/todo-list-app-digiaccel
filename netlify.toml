[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Ship the MongoDB driver as regular node_modules instead of bundling it
  # (it has optional native requires that esbuild can't resolve).
  external_node_modules = ["mongoose", "mongodb"]

# The Express API runs as a single Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
